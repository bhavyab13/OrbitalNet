[project]
name = "orbitalnet-sim"
version = "0.1.0"
description = "OrbitalNet world simulator, planner and mission runner"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "skyfield>=1.49",
  "sgp4>=2.23",
  "numpy>=1.26",
  "httpx>=0.27",
  "websockets>=12",
  "cryptography>=43",
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
